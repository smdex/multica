[project]
name = "multica"
revision = "1.0"

[profiles.development]
# Local development may use the server's documented non-production default.
# Supplying this through SecretSpec overrides that default only for processes
# that have a value in the user's keyring.
JWT_SECRET = { description = "JWT signing secret", required = false, type = "hex", generate = { bytes = 32 } }
MULTICA_LLM_API_KEY = { description = "Optional server-side LLM API key", required = false, type = "password" }
